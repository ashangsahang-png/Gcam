name: Build APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # diperlukan untuk melampirkan APK ke GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Memasang Gradle 8.7 sendiri, jadi folder gradle wrapper tidak wajib ada
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Ganti nama APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RasaCam-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RasaCam-debug-apk
          path: RasaCam-*.apk
          if-no-files-found: error

      # Hanya saat push tag, misalnya: git tag v1.0 && git push origin v1.0
      - name: Rilis di GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: RasaCam-*.apk
